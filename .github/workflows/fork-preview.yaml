name: Deploy fork branch preview

# Optional, opt-in fallback for contributors who would rather host their own
# preview than rely on the upstream one (see DEVELOPMENT.md). This runs in the
# CONTRIBUTOR's fork on push, so it gets a write token for their repository and
# publishes to their own GitHub Pages site.
#
# It is disabled unless the fork owner sets the repository variable
# ENABLE_FORK_PREVIEW to 'true', so it never runs unexpectedly in a fork that
# has not opted in, and never upstream.
on:
  push:
    branches-ignore:
      - main
      - gh-pages

concurrency: fork-preview-${{ github.ref }}

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy branch preview
    runs-on: ubuntu-latest
    if: vars.ENABLE_FORK_PREVIEW == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build docs
        uses: ./.github/actions/build-docs

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          # Keyed by branch rather than PR number: on push the pull request may
          # not exist yet.
          destination_dir: branch-preview/${{ github.ref_name }}
          keep_files: true

      - name: Summarize preview URL
        run: |
          echo "Preview will be published at:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/branch-preview/${{ github.ref_name }}/" >> "$GITHUB_STEP_SUMMARY"
