name: Publish docs via GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build docs
        uses: ./.github/actions/build-docs

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          # Branch-based Pages reads the custom domain from a CNAME file at the
          # publish root, so it must be (re)written on every deploy.
          cname: docs.emberarchive.org
          # Preserve the pr-preview/ directory published by preview.yaml,
          # which lives on the same branch as the production site.
          keep_files: true

concurrency:
  group: pages
  cancel-in-progress: true
