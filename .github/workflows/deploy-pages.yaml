name: Publish docs via GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-docs.yaml
    with:
      upload-pages-artifact: true

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Creates the GitHub Pages site with the "GitHub Actions" source if it
      # does not exist yet, so forks deploy without a manual Settings -> Pages
      # step. No-op when the site is already configured.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

concurrency:
  group: pages
  cancel-in-progress: true
