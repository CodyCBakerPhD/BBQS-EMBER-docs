name: Build docs

on:
  workflow_call:
    inputs:
      upload-pages-artifact:
        required: false
        type: boolean
        default: false
        description: 'Whether to upload the build as a GitHub Pages artifact'
      upload-preview-artifact:
        required: false
        type: boolean
        default: false
        description: 'Whether to upload the build for the PR preview pipeline'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build docs
        uses: ./.github/actions/build-docs

      - name: Upload Pages artifact
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # Handed to preview.yaml, which runs with privileges this job does not
      # have. See SECURITY.md.
      - name: Save PR number
        if: inputs.upload-preview-artifact
        run: echo "${{ github.event.number }}" > pr-number.txt

      - name: Upload built site for preview
        if: inputs.upload-preview-artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-site
          path: site
          retention-days: 1

      - name: Upload PR number for preview
        if: inputs.upload-preview-artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-number
          path: pr-number.txt
          retention-days: 1
