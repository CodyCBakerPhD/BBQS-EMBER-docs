name: Remove PR preview

# Teardown needs the preview deploy token, and a `pull_request` run from a fork
# cannot read secrets, so this uses pull_request_target to run in this
# repository's context.
#
# SECURITY: this workflow can read the preview deploy token on an untrusted
# trigger. Read SECURITY.md before changing it.
on:
  pull_request_target:
    types:
      - closed

concurrency: preview-${{ github.event.pull_request.head.ref }}

permissions:
  contents: read
  pull-requests: write

jobs:
  remove-preview:
    name: Remove preview
    runs-on: ubuntu-latest
    if: vars.PREVIEW_REPOSITORY != ''
    steps:
      # Checks out the base branch, NOT the pull request head.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          action: remove
          deploy-repository: ${{ vars.PREVIEW_REPOSITORY }}
          token: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
          pages-base-url: ${{ vars.PREVIEW_BASE_URL }}
