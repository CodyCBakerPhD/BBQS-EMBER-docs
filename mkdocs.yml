site_name: EMBER Docs
repo_name: aplbrain/bbqs-ember-docs
repo_url: https://github.com/aplbrain/BBQS-EMBER-docs

theme:
  name: material
  language: en
  logo: assets/ember-logo.png
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: deep orange
      toggle:
        icon: material/theme-light-dark
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: deep orange
      toggle:
        icon: material/theme-light-dark
        name: Switch to light mode


extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - admonition
  - pymdownx.details

nav:
  - Home: index.md
  - Getting Started:
    - Overview: getting-started/index.md
  - User Guide:
    - Overview: user-guide/index.md
    - The DANDI Client: user-guide/dandi-cli.md
    - 'EMBER-DANDI: Uploading Data': user-guide/uploading-data.md
    - 'EMBER-DANDI: Downloading Data': user-guide/downloading-data.md
    - 'EMBER-Vault: Uploading Data': user-guide/embervault-uploading-data.md
    - 'EMBER: Standardizing Data': user-guide/data-standardization.md
  - Example Standardization and Reproducibility: example-standardization-and-reproducibility/Suthana_Zenodo.md
  - User Stories:
    - Overview: user-stories/index.md
    - Clip Extractor:
      - Why the Clip Extractor exists: user-stories/clip-extractor/index.md
      - Pose estimation stories: user-stories/clip-extractor/pose-estimation.md
      - Archive workflow stories: user-stories/clip-extractor/archive-workflows.md
      - Privacy and provenance stories: user-stories/clip-extractor/privacy-and-provenance.md
